name: Tests
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  RUSTFLAGS: -Dwarnings
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  test:
    env:
      RUST_LOG: off
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup update stable
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - name: cargo nextest
        run: cargo nextest run --release --workspace
      - name: cargo test --doc
        run: cargo test --release --doc --workspace

  test-annotation:
    env:
      RUST_LOG: off
    name: Tests (annotation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Rust
        run: rustup update stable
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - name: cargo nextest
        run: cargo nextest run --release --workspace --features annotation

  test-weak-memory:
    env:
      RUST_LOG: off
    name: Tests (weak-memory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup update stable
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - name: cargo nextest
        run: cargo nextest run --release --workspace --features weak-memory

  test-checked-cell:
    env:
      RUST_LOG: off
    name: Tests (checked-cell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup update stable
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - name: cargo nextest
        run: cargo nextest run --release --workspace --features checked-cell,weak-memory
      - name: cargo test --doc
        run: cargo test --release --doc -p shuttle-std --features checked-cell

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup update stable
      - name: Install rustfmt
        run: rustup component add rustfmt
      - name: "rustfmt --check"
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup update stable
      - name: Install clippy
        run: rustup component add clippy
      - name: clippy
        run: cargo clippy --all-targets -- -D clippy::all
      - name: clippy (annotation)
        run: cargo clippy --all-targets --features annotation -- -D clippy::all
      - name: clippy (weak-memory)
        run: cargo clippy --all-targets --features weak-memory -- -D clippy::all
      - name: clippy (checked-cell)
        run: cargo clippy --all-targets --features checked-cell -- -D clippy::all
      - name: clippy (checked-cell, weak-memory)
        run: cargo clippy --all-targets --features checked-cell,weak-memory -- -D clippy::all

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup update stable
      - name: cargo doc
        run: cargo doc --no-deps

