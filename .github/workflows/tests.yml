name: Tests
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  RUSTFLAGS: -Dwarnings
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  test:
    env:
      RUST_LOG: off
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup update stable
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - name: cargo nextest
        run: cargo nextest run --release --workspace
      - name: cargo test --doc
        run: cargo test --release --doc --workspace

  test-annotation:
    env:
      RUST_LOG: off
    name: Tests (annotation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Rust
        run: rustup update stable
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - name: cargo nextest
        run: cargo nextest run --release --workspace --features annotation

  test-check-scheduling-points:
    env:
      RUST_LOG: off
    name: Tests (scheduling-point checker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup update stable
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      # The wrapper crates still have missing scheduling points (see #262), so only the core crates
      # run with the checker on for now.
      - name: cargo nextest
        run: cargo nextest run --release -p shuttle -p shuttle-engine -p shuttle-std -p shuttle-schedulers --features shuttle/check-scheduling-points

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup update stable
      - name: Install rustfmt
        run: rustup component add rustfmt
      - name: "rustfmt --check"
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup update stable
      - name: Install clippy
        run: rustup component add clippy
      - name: clippy
        run: cargo clippy --all-targets -- -D clippy::all
      - name: clippy (annotation)
        run: cargo clippy --all-targets --features annotation -- -D clippy::all
      - name: clippy (check-scheduling-points)
        run: cargo clippy --all-targets --features check-scheduling-points -- -D clippy::all

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup update stable
      - name: cargo doc
        run: cargo doc --no-deps

