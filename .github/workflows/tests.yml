name: Tests
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  RUSTFLAGS: -Dwarnings
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  test:
    env:
      RUST_LOG: off
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup update stable
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - name: cargo nextest
        run: cargo nextest run --release --workspace
      - name: cargo test --doc
        run: cargo test --release --doc --workspace

  test-annotation:
    env:
      RUST_LOG: off
    name: Tests (annotation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Rust
        run: rustup update stable
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - name: cargo nextest
        run: cargo nextest run --release --workspace --features annotation

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup update stable
      - name: Install rustfmt
        run: rustup component add rustfmt
      - name: "rustfmt --check"
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup update stable
      - name: Install clippy
        run: rustup component add clippy
      - name: clippy
        run: cargo clippy --all-targets -- -D clippy::all
      - name: clippy (annotation)
        run: cargo clippy --all-targets --features annotation -- -D clippy::all

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup update stable
      - name: cargo doc
        run: cargo doc --no-deps

  # Catch anything that would make a crate unpublishable -- missing metadata, a
  # file the packaged crate needs but doesn't include, a version requirement on a
  # sibling crate that no longer matches -- while it is still a PR comment rather
  # than a half-finished release.
  #
  # `--all` checks every crate rather than only the ones bumped on this PR, and
  # `--no-verify` skips rebuilding each crate from its tarball, which the Publish
  # workflow does before it uploads.
  publish-dry-run:
    name: Publish dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup update stable
      - name: cargo publish --dry-run
        run: python3 scripts/publish.py --all --dry-run --no-verify

