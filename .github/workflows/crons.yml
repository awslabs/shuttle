name: Cron jobs
permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
  schedule:
    - cron: '0 2 * * 1' # run at 2 AM UTC every Monday

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Install Rust
        run: rustup update stable
      - name: Install Audit
        run: cargo install cargo-audit
      - name: cargo audit
        run: cargo audit
  
  # Cross-checks the incrementally maintained schedulable-task index against a full
  # recomputation on every scheduling decision. This restores the O(tasks) per-step
  # work that the index exists to avoid, so it is too slow for per-PR CI, but it is
  # the safety net for the invariant that every task state transition keeps the
  # index in sync.
  verify-schedulable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Install Rust
        run: rustup update stable
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - name: cargo nextest with verify-schedulable
        run: cargo nextest run --release -p shuttle --features verify-schedulable
      - name: Notify failed build
        uses: jayqi/failed-build-issue-action@v1
        if: failure()
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # Runs Clippy, fmt, doc and tests on beta. 
  # Exists to not get "caught off guard" by new Rust versions bringing new clippies.
  beta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Install Rust
        run: rustup update beta
      - name: Default to beta
        run: rustup default beta
      - name: Install rustfmt
        run: rustup component add rustfmt
      - name: Install Clippy
        run: rustup component add clippy
      - name: clippy
        run: cargo clippy --all-targets -- -D clippy::all
      - name: "rustfmt --check"
        run: cargo fmt --all -- --check
      - name: cargo doc
        run: cargo doc --no-deps
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - name: cargo nextest
        run: cargo nextest run --release --workspace
      - name: cargo test --doc
        run: cargo test --release --doc --workspace
      - name: Notify failed build
        uses: jayqi/failed-build-issue-action@v1
        if: failure() 
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
