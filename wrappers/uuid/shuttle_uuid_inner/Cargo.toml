[package]
name = "shuttle-uuid-inner"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Shuttle's internal implementation of the `uuid` crate. Do not depend on this crate directly; use `shuttle-uuid`."
repository = "https://github.com/awslabs/shuttle"
# This test shares its source with `shuttle-uuid`'s tests, which is outside of this package.
exclude = ["tests/consumer.rs"]

# uuid's features, with the same implications between them, each also turned on in uuid. They
# decide which parts of uuid's API this crate mirrors, as they do in uuid. The features that need
# Shuttle bring it in: `rng` for its random number generator, and for the generator that replaces
# it where the scheduler provides no random data, and `std` for the fake clock. Both generators'
# and the clock's state live in the storage of each execution.
[features]
default = [ "std" ]
arbitrary = [ "uuid-orig/arbitrary", "dep:arbitrary" ]
atomic = [ "uuid-orig/atomic" ]
borsh = [ "uuid-orig/borsh", "dep:borsh" ]
bytemuck = [ "uuid-orig/bytemuck", "dep:bytemuck" ]
fast-rng = [ "uuid-orig/fast-rng", "rng" ]
js = [ "uuid-orig/js" ]
macro-diagnostics = [ "uuid-orig/macro-diagnostics" ]
md5 = [ "uuid-orig/md5" ]
rng = [ "uuid-orig/rng", "dep:shuttle", "dep:shuttle-engine" ]
rng-getrandom = [ "uuid-orig/rng-getrandom", "rng" ]
rng-rand = [ "uuid-orig/rng-rand", "rng" ]
serde = [ "uuid-orig/serde", "dep:serde_core" ]
sha1 = [ "uuid-orig/sha1" ]
slog = [ "uuid-orig/slog", "dep:slog" ]
std = [ "uuid-orig/std", "dep:shuttle", "dep:shuttle-engine" ]
v1 = [ "uuid-orig/v1", "atomic" ]
v3 = [ "uuid-orig/v3", "md5" ]
v4 = [ "uuid-orig/v4", "rng" ]
v5 = [ "uuid-orig/v5", "sha1" ]
v6 = [ "uuid-orig/v6", "atomic" ]
v7 = [ "uuid-orig/v7", "rng" ]
v8 = [ "uuid-orig/v8" ]
zerocopy = [ "uuid-orig/zerocopy", "dep:zerocopy" ]

[dependencies]
# The API mirrored here is uuid 1.29's.
uuid-orig = { package = "uuid", version = "1.29", default-features = false }
# 0.9.2 is the first `shuttle` built on `shuttle-engine`, so that the engine below is the one that
# runs the test.
shuttle = { path = "../../../shuttle", version = "0.9.2", optional = true }
# For `ExecutionState::{get_storage, init_storage}`, which keep the fake clock's state, and that of
# the generator that `rng` uses where the scheduler provides no random data, per execution.
shuttle-engine = { path = "../../../shuttle-engine", version = "0.1", optional = true }
# The crates that uuid implements traits of, at uuid's requirements.
arbitrary = { version = "1.1.3", optional = true }
borsh = { version = "1", optional = true, default-features = false }
bytemuck = { version = "1.22", optional = true }
serde_core = { version = "1.0.221", optional = true, default-features = false }
slog = { version = "2", optional = true }
zerocopy = { version = "0.8", optional = true, features = ["derive"] }

[dev-dependencies]
# The tests use every constructor.
shuttle-uuid-inner = { path = ".", features = ["v1", "v3", "v4", "v5", "v6", "v7", "v8", "serde"] }
serde = { version = "1.0.221", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.2.0"

[lints.rust]
# uuid's unstable `zerocopy` support is behind `--cfg uuid_unstable`, and so is this crate's.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(uuid_unstable)"] }

[package.metadata.docs.rs]
features = ["v1", "v3", "v4", "v5", "v6", "v7", "v8", "serde"]
