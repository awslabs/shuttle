[package]
name = "shuttle-parking_lot-impl"
version = "0.1.2"
edition = "2024"
license = "Apache-2.0"
description = "Internal implementation of the `parking_lot` crate for use with the Shuttle concurrency testing tool. Do not depend on this crate directly; use `shuttle-parking_lot`."
repository = "https://github.com/awslabs/shuttle"

[features]
# Enable `Arc`-based lock guards (`lock_arc`, `read_arc`, `write_arc`, ...). Forwarded to `lock_api`.
arc_lock = ["lock_api/arc_lock"]
# `serde`/`owning_ref`/`nightly` are forwarded to `lock_api`, matching `parking_lot`'s feature set.
serde = ["lock_api/serde"]
owning_ref = ["lock_api/owning_ref"]
nightly = ["lock_api/nightly"]
# `send_guard` makes lock guards `Send` (when the data allows), mirroring `parking_lot`; see the
# `GuardMarker` impls in mutex.rs/rwlock.rs. The remaining two features concern the native
# `parking_lot_core` backend, which Shuttle replaces entirely, so they have no effect here.
send_guard = []
deadlock_detection = []
hardware-lock-elision = []

[dependencies]
# `>=0.9.7`: the lock needs `BatchSemaphore::acquire_reserving` and the unfair `upgrade` that
# reserves the semaphore, which first ship in shuttle 0.9.6, and `with_fair_releases`, `load_permits`
# and `has_waiters`, which first ship in 0.9.7.
shuttle = { path = "../../../shuttle", version = ">=0.9.7, <0.10"}
# `0.4.6`: `RawRwLock` implements `is_locked_exclusive`, which is a trait method from 0.4.6 on.
lock_api = "0.4.6"
tracing = { version = "0.1.36", default-features = false, features = ["std"] }

[dev-dependencies]
# `tests/rwlock_clocks.rs` reads vector clocks, which are empty without this feature. The version
# keeps this dependency in the published crate: `cargo package` drops a path dependency without one.
shuttle = { path = "../../../shuttle", version = ">=0.9.7, <0.10", features = ["vector-clocks"] }
# `tests/rwlock_reference_model.rs` checks the parity tests' reference model against the real
# `parking_lot`. The model copies 0.12.5. `Cargo.lock` is not tracked, so each CI run uses the newest
# 0.12.x release, and a release that changes the behavior that the model copies fails the test, also
# on an unrelated PR. The failure message gives this cause. The weekly `beta` job in
# `.github/workflows/crons.yml` also runs the test, and opens an issue when it fails.
parking_lot = "0.12.5"
