[package]
name = "shuttle-crossbeam-epoch"
# Wrappers mirror the version of the crate they wrap, so that a downstream crate can depend on the
# wrapper with the same `version = "0.9"` requirement it would have used for crossbeam-epoch.
version = "0.9.21"
edition = "2024"
license = "Apache-2.0"
description = "crossbeam-epoch wrapper for the Shuttle concurrency testing tool."
repository = "https://github.com/awslabs/shuttle"

[features]
shuttle = ["dep:shuttle-crossbeam-epoch-inner"]

# crossbeam-epoch's features, with the same implications between them. Each is forwarded to
# crossbeam-epoch, and to the inner crate when `shuttle` is enabled. `loom` and `loom-crate` are not
# mirrored: Shuttle is the point of this crate.
default = ["std"]
alloc = ["crossbeam-epoch-orig/alloc", "shuttle-crossbeam-epoch-inner?/alloc"]
std = ["alloc", "crossbeam-epoch-orig/std", "shuttle-crossbeam-epoch-inner?/std"]
nightly = ["crossbeam-epoch-orig/nightly", "shuttle-crossbeam-epoch-inner?/nightly"]

[dependencies]
cfg-if = "1.0"
# Without default features, so that `default-features = false` on this crate reaches crossbeam-epoch
# too. Under `shuttle` this crate has crossbeam-epoch 0.9.21's API, so it asks for 0.9.21 in both
# modes.
crossbeam-epoch-orig = { package = "crossbeam-epoch", version = "0.9.21", default-features = false }
shuttle-crossbeam-epoch-inner = { path = "./shuttle_crossbeam_epoch_inner", version = "0.1.0", optional = true, default-features = false }

[dev-dependencies]
# For the tests that run under `--features shuttle`.
shuttle = { path = "../../shuttle", version = "0.9.2" }
