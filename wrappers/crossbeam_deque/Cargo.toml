[package]
name = "shuttle-crossbeam-deque"
# Wrappers mirror the version of the crate they wrap, so that a downstream crate can depend on the
# wrapper with the same `version = "0.8"` requirement it would have used for crossbeam-deque.
version = "0.8.8"
edition = "2024"
license = "Apache-2.0"
description = "crossbeam-deque wrapper for the Shuttle concurrency testing tool."
repository = "https://github.com/awslabs/shuttle"

[features]
shuttle = ["dep:shuttle-crossbeam-deque-inner"]

# crossbeam-deque's features. Each is forwarded to crossbeam-deque, and to the inner crate when
# `shuttle` is enabled.
default = ["std"]
std = ["crossbeam-deque-orig/std", "shuttle-crossbeam-deque-inner?/std"]

[dependencies]
cfg-if = "1.0"
# Without default features, so that `default-features = false` on this crate reaches crossbeam-deque
# too. Under `shuttle` this crate has crossbeam-deque 0.8.8's API, so it asks for 0.8.8 in both
# modes.
crossbeam-deque-orig = { package = "crossbeam-deque", version = "0.8.8", default-features = false }
shuttle-crossbeam-deque-inner = { path = "./shuttle_crossbeam_deque_inner", version = "0.1.0", optional = true, default-features = false }

[dev-dependencies]
# For the tests that run under `--features shuttle`.
shuttle = { path = "../../shuttle", version = "0.9.2" }
