[package]
name = "shuttle-crossbeam-queue"
# Wrappers mirror the version of the crate they wrap, so that a downstream crate can depend on the
# wrapper with the same `version = "0.3"` requirement it would have used for crossbeam-queue.
version = "0.3.14"
edition = "2024"
license = "Apache-2.0"
description = "crossbeam-queue wrapper for the Shuttle concurrency testing tool."
repository = "https://github.com/awslabs/shuttle"

[features]
shuttle = ["dep:shuttle-crossbeam-queue-inner"]

# crossbeam-queue's features, with the same implications between them. Each is forwarded to
# crossbeam-queue, and to the inner crate when `shuttle` is enabled.
default = ["std"]
alloc = ["crossbeam-queue-orig/alloc", "shuttle-crossbeam-queue-inner?/alloc"]
std = ["alloc", "crossbeam-queue-orig/std", "shuttle-crossbeam-queue-inner?/std"]
nightly = ["crossbeam-queue-orig/nightly", "shuttle-crossbeam-queue-inner?/nightly"]

[dependencies]
cfg-if = "1.0"
# Without default features, so that `default-features = false` on this crate reaches crossbeam-queue
# too. Under `shuttle` this crate has crossbeam-queue 0.3.14's API, so it asks for 0.3.14 in both
# modes.
crossbeam-queue-orig = { package = "crossbeam-queue", version = "0.3.14", default-features = false }
shuttle-crossbeam-queue-inner = { path = "./shuttle_crossbeam_queue_inner", version = "0.1.0", optional = true, default-features = false }

[dev-dependencies]
# For the tests that run under `--features shuttle`.
shuttle = { path = "../../shuttle", version = "0.9.2" }
