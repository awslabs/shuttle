[package]
name = "shuttle-crossbeam-utils"
# Wrappers mirror the version of the crate they wrap, so that a downstream crate can depend on the
# wrapper with the requirement it used for crossbeam-utils.
version = "0.8.23"
edition = "2024"
license = "Apache-2.0"
description = "crossbeam-utils wrapper for the Shuttle concurrency testing tool."
repository = "https://github.com/awslabs/shuttle"

[features]
# Under `shuttle`, `Parker::park_deadline` takes shuttle-time's `Instant`, so the feature turns on
# shuttle-time's `shuttle` feature too: a consumer that takes `Instant` from `shuttle_time::time`
# gets the same type the parker takes.
shuttle = [ "dep:shuttle-crossbeam-utils-inner", "shuttle-time/shuttle" ]

# crossbeam-utils's features, forwarded to it, and to the inner crate when `shuttle` is enabled.
default = [ "crossbeam-utils-orig/default", "shuttle-crossbeam-utils-inner?/default" ]
std = [ "crossbeam-utils-orig/std", "shuttle-crossbeam-utils-inner?/std" ]
nightly = [ "crossbeam-utils-orig/nightly", "shuttle-crossbeam-utils-inner?/nightly" ]

[dependencies]
cfg-if = "1.0"
# Without default features, so that `default-features = false` on this crate reaches crossbeam-utils
# too. Under `shuttle` this crate has crossbeam-utils 0.8.23's API, so it needs 0.8.23 in both modes.
crossbeam-utils-orig = { package = "crossbeam-utils", version = "0.8.23", default-features = false }
shuttle-crossbeam-utils-inner = { path = "./shuttle_crossbeam_utils_inner", version = "0.1", optional = true, default-features = false }
shuttle-time = { path = "../time", version = "0.1", optional = true }

[dev-dependencies]
# For the tests that run under `--features shuttle`.
shuttle = { path = "../../shuttle", version = "0.9.2" }
shuttle-time = { path = "../time", version = "0.1" }
