[package]
name = "shuttle-tokio-impl-inner"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Internal implementation of the `tokio` crate for use with the Shuttle concurrency testing tool. Do not depend on this crate directly; use `shuttle-tokio`."
repository = "https://github.com/awslabs/shuttle"

[features]
# Include nothing by default
default = []

# enable everything
full = []

fs = []
io-util = []
# stdin, stdout, stderr
io-std = []
macros = []
net = []
parking_lot = []
process = []
# Includes basic task execution capabilities
rt = []
rt-multi-thread = []
signal = []
sync = []
test-util = []
time = []
# Unstable feature. Requires `--cfg tokio_unstable` to enable.
io-uring = []
# Unstable feature. Requires `--cfg tokio_unstable` to enable.
taskdump = []

# tokio's optional dependencies are also implicit features. They mean nothing
# here, but are mirrored so that every feature of `shuttle-tokio` has a
# counterpart all the way down and nothing gets missed if one of them ever does
# start to mean something here.
bytes = []
libc = []
mio = []
signal-hook-registry = []
socket2 = []
tokio-macros = []
tracing = []
windows-sys = []

[dependencies]
criterion = { version = "0.8", features = [
    "async",
    "async_tokio",
    "html_reports",
] }
futures = "0.3.24"
pin-project = "1.0.12"
pin-project-lite = "0.2.11"
regex = "1.10.1"
# 0.9.7 is the first `shuttle` with `current::try_get_current_task`, which `task_local!` uses. It is
# also built on `shuttle-engine`, as 0.9.0 and 0.9.1 are not: with those, the `shuttle-engine` below
# would be a second engine, which never runs, so `Notify::notified` and task-locals would panic.
shuttle = { version = "0.9.7", path = "../../../../../shuttle" }
# For `runtime::thread::switch`, a scheduling point that, unlike `shuttle::thread::yield_now`,
# doesn't wake the current task, and for `thread_support::DestroyedLastKey`, the thread-local that
# `task_local!` keeps each task's values in.
shuttle-engine = { version = "0.1.5", path = "../../../../../shuttle-engine" }
smallvec = "1.6.1"
test-log = { version = "0.2.11", default-features = false, features = [
    "trace",
] }
tracing = { version = "0.1.21", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.9", features = ["env-filter"] }
tokio = { version = "1.42", features = ["macros", "time", "sync"] }
tokio-macros = { package = "shuttle-tokio-macros-impl", path = "../../tokio-macros", version = "0.1" }

[dev-dependencies]
assert_matches = "1.5"
# The task-local tests run tokio's own `task_local!` under Shuttle, to show that it does not work there.
# 1.48 is the first with `LocalKey::try_get`, which they use.
tokio = { version = "1.48", features = ["rt"] }

# docs.rs builds with no features by default, which hides most of the crate.
[package.metadata.docs.rs]
features = ["full"]
