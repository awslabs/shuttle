[package]
name = "shuttle-io-uring-impl"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Internal implementation of the `io-uring` crate for use with the Shuttle concurrency testing tool: a simulated kernel ring whose completions Shuttle schedules. Do not depend on this crate directly; use `shuttle-io-uring`."
repository = "https://github.com/awslabs/shuttle"

# io_uring is Linux's; on other targets the crate is empty (see src/lib.rs).
[target.'cfg(target_os = "linux")'.dependencies]
bitflags = "2"
libc = "0.2"
shuttle = { path = "../../../shuttle", version = "<0.10" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
tempfile = "3"
