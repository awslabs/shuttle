[package]
name = "shuttle-io-uring-impl"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Internal implementation of the `io-uring` crate for use with the Shuttle concurrency testing tool: a simulated kernel ring whose completions Shuttle schedules. Do not depend on this crate directly; use `shuttle-io-uring`."
repository = "https://github.com/awslabs/shuttle"
# These tests share their sources with `shuttle-io-uring`'s tests, which are outside this package.
exclude = ["tests/consumer.rs", "tests/parity.rs"]

# io_uring is Linux's; on other targets the crate is empty (see src/lib.rs).
[target.'cfg(target_os = "linux")'.dependencies]
bitflags = "2"
libc = "0.2"
# 0.9.2 is the first `shuttle` built on `shuttle-engine`, so that the engine below is the one that
# runs the test.
shuttle = { path = "../../../shuttle", version = ">=0.9.2, <0.10" }
# For `ExecutionState::{get_storage, init_storage}`, which hold the simulation's state for one
# execution.
shuttle-engine = { path = "../../../shuttle-engine", version = "0.1" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
tempfile = "3"
