[package]
name = "shuttle-io-uring"
version = "0.7.15"
edition = "2024"
license = "Apache-2.0"
description = "io-uring wrapper for the Shuttle concurrency testing tool."
repository = "https://github.com/awslabs/shuttle"

[features]
shuttle = [ "dep:shuttle-io-uring-impl" ]

direct-syscall = [ "io-uring/direct-syscall" ]
io_safety = [ "io-uring/io_safety" ]
overwrite = [ "io-uring/overwrite" ]

[dependencies]
cfg-if = "1.0"
io-uring = "0.7"
shuttle-io-uring-impl = { path = "./io_uring_impl", version = "0.1.0", optional = true }
