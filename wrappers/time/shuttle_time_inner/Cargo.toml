[package]
name = "shuttle-time-inner"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Shuttle's internal implementation of `std::time`. Do not depend on this crate directly; use `shuttle-time`."
repository = "https://github.com/awslabs/shuttle"
# This test shares its source with `shuttle-time`'s tests, which is outside of this package.
exclude = ["tests/consumer.rs"]

[dependencies]
# 0.9.2 is the first `shuttle` built on `shuttle-engine`, so that the engine below is the one that
# runs the test.
shuttle = { path = "../../../shuttle", version = "0.9.2" }
# For `ExecutionState::{get_storage, init_storage}`, which hold the clock's state for one execution.
shuttle-engine = { path = "../../../shuttle-engine", version = "0.1" }

[dev-dependencies]
tempfile = "3.2.0"
